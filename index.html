<style>
/* 한 화면: 캔버스 바닷가 전체, 하늘 위에 호흡 안내, 모래는 그대로 손글씨 캔버스 */
:root {

  color-scheme: light;
}
html, body { height: 100%; overflow: hidden; }
[hidden] { display: none !important; }
body { word-break: keep-all; background: var(--sage); color: var(--ink); font-family: var(--f-body); -webkit-tap-highlight-color: transparent; }
#sea { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }

  background: rgba(251,246,238,.78); border: 1px solid var(--line); border-radius: 999px;

}

.mood button { font: inherit; font-size: 12.5px; color: var(--ink); background: rgba(251,246,238,.82); border: 1px solid var(--line); border-radius: 999px; padding: 6px 11px; cursor: pointer; }
.mood button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.together { font-size: 12.5px; color: var(--ink); background: rgba(251,246,238,.7); border-radius: 999px; padding: 4px 12px; text-shadow: none; }
.spark { position: fixed; width: 8px; height: 8px; border-radius: 50%; background: radial-gradient(circle, #fff 0, rgba(255,240,220,.9) 35%, rgba(255,230,200,0) 70%); pointer-events: none; z-index: 2; animation: spark 3.2s ease-out forwards; }
@keyframes spark { 0% { opacity: 0; transform: translateY(0) scale(.6); } 15% { opacity: 1; transform: translateY(-4px) scale(1.6); } 100% { opacity: 0; transform: translateY(-46px) scale(.8); } }

.ob-card { width: min(320px, 100%); background: rgba(251,246,238,.94); border: 1px solid var(--line); border-radius: 22px; padding: 22px 20px 18px; display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center; animation: drift .8s ease both; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }

body.night .cue, body.night .count, body.night .brand, body.night .door-top h1, body.night .door-top .lede { color: #eef3f1; text-shadow: 0 1px 14px rgba(5,12,28,.9); }
body.night .brand small { color: #b8c6c8; }

.unlock { width: min(340px, 100%); box-sizing: border-box; background: rgba(251,246,238,.9); border: 1px solid var(--line); border-radius: 18px; padding: 12px 16px; display: grid; justify-items: center; gap: 8px; text-shadow: none; animation: drift .8s ease both; }
.unlock p { margin: 0; font-size: 13.5px; line-height: 1.6; color: var(--ink); text-align: center; text-wrap: balance; }
.pebbles { display: flex; gap: 14px; align-items: flex-end; }
.pebbles .pb { display: grid; justify-items: center; gap: 2px; font-size: 10.5px; color: var(--ink-soft); }
.pebbles svg { width: 50px; height: 38px; display: block; overflow: visible; }

@keyframes pop { 0% { transform: scale(.4); } 60% { transform: scale(1.25); } 100% { transform: scale(1); } }
.waves { width: min(360px, 100%); box-sizing: border-box; background: rgba(251,246,238,.9); border: 1px solid var(--line); border-radius: 18px; padding: 12px 14px 10px; text-shadow: none; display: grid; gap: 6px; }
.waves h3 { margin: 0; font-family: var(--f-display); font-size: 14px; font-weight: 700; color: var(--ink); text-align: left; }

.mode { font: inherit; text-align: left; border: 1px solid var(--line); background: rgba(251,246,238,.8); border-radius: 16px; padding: 10px 14px; cursor: pointer; color: var(--ink); display: grid; gap: 2px; }
.mode b { font-family: var(--f-display); font-size: 15px; }
.mode span { font-size: 12px; color: var(--ink-soft); line-height: 1.5; }
.mode[aria-pressed="true"] { border-color: var(--accent); background: #fff; box-shadow: 0 0 0 1px var(--accent) inset; }
details.why { width: 100%; text-align: left; font-size: 12.5px; line-height: 1.65; color: var(--ink-soft); }
details.why summary { cursor: pointer; color: var(--ink); text-align: center; list-style: none; text-decoration: underline; text-underline-offset: 3px; }
details.why summary::-webkit-details-marker { display: none; }
details.why ul { margin: 10px 0 0; padding-left: 18px; display: grid; gap: 6px; }
.door { max-width: 400px !important; width: 100%; height: 100%; justify-content: space-between; padding-block: 9vh 22px; box-sizing: border-box; gap: 0 !important; }
.door .btn { width: 100%; max-width: 300px; }
@media (prefers-reduced-motion: reduce) { .bar i { transition: none; } }
</style>

<canvas id="sea" aria-label="바닷가 모래. 손가락이나 마우스로 모래 위에 글씨를 쓸 수 있어요"></canvas>

<div id="intro">

<script>
document.body.classList.add('at-intro');
(() => {
  const cv = document.getElementById('sea');
  const ctx = cv.getContext('2d');
  const $ = id => document.getElementById(id);
  const cueEl = $('cue'), countEl = $('count'), timeEl = $('timeChip'), barEl = $('barFill');

  let TOTAL = 60; const CYC = 10, PRE = 4;
  // 파도 묶음: 작게 → 조금 더 → 한 번에 크게 (3번의 숨이 한 묶음)
  const REACH = [0.42, 0.66, 1], SET = CYC * REACH.length;
  // 처음 여섯 번의 숨: 살살 닿다가 점점 깊이, 여섯 번째에 시원하게 끝까지
  const RAMP = [0.3, 0.46, 0.6, 0.74, 0.88, 1], RAMP_T = CYC * RAMP.length, PRE_REACH = 0.2;
  const reachAt = n => n < RAMP.length ? RAMP[n] : REACH[(n - RAMP.length) % REACH.length];
  const prevReachAt = n => n <= 0 ? PRE_REACH : reachAt(n - 1);
  const WAVE_CUE = ['파도가 살며시 다가와요', '근심의 끝자락을 적셔요', '조금씩 가져가요', '더 많이 데려가요', '거의 다 데려갔어요', '마지막 파도가 모두 씻어가요'];
  const ease = x => 0.5 - 0.5 * Math.cos(Math.PI * Math.min(1, Math.max(0, x)));
  let W = 0, H = 0, DPR = 1;
  let skyC, sandC, seaTexC;
  const foamSeed = Array.from({ length: 2000 }, () => Math.random());
  // p = 0 이면 물이 멀리 물러나 모래가 다 드러나고, p = 1 이면 파도가 화면 끝까지 덮어요
  const geo = () => ({ horizon: H * 0.34, out: H * 0.47, inn: H + 70 });

  /* ---------- 호흡 방법 (모두 10초 = 1분에 6번) ---------- */
  const MODES = {
    long: { name: '길게 내쉬기', segs: [{ k: 'in', d: 4, cue: '들이쉬어요' }, { k: 'out', d: 6, cue: '길게 내쉬어요' }] },
    reso: { name: '공명 호흡', segs: [{ k: 'in', d: 5, cue: '들이쉬어요' }, { k: 'out', d: 5, cue: '내쉬어요' }] },
    sigh: { name: '한숨 호흡', segs: [{ k: 'in', d: 2.5, cue: '코로 들이쉬어요' }, { k: 'in2', d: 1, cue: '코로 한 번 더' }, { k: 'out', d: 6.5, cue: '입으로 길게 내쉬어요' }] },
  };
